<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucas the Lion — AAC Board</title>
<style>
:root{
  --ink:#18212f; --muted:#64748b; --line:#d9e1eb; --paper:#f4f7fb;
  --orange:#f6a34b; --green:#a8e9ad; --blue:#b9edf2; --pink:#f8c2d0;
  --cream:#fff8df; --focus:#285fe8;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f4f7fb,#eaf1f8);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px clamp(14px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:48px;height:48px;border-radius:15px;background:#ffefd5;display:grid;place-items:center;font-size:29px}
h1{font-size:clamp(1.25rem,2.5vw,1.8rem);margin:0;letter-spacing:-.03em}
.subtitle{font-size:.9rem;color:var(--muted);margin-top:3px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.utility{border:1px solid #d5deea;background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;color:#263348}
.utility:hover{background:#f1f5f9}
main{max-width:1250px;margin:0 auto;padding:clamp(12px,2.5vw,28px)}
.sentence-panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:18px;box-shadow:0 5px 18px #2538580a}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panel-top h2{font-size:1rem;margin:0}
.hint{font-size:.84rem;color:var(--muted)}
.sentence{min-height:60px;border:2px dashed #d6deea;border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fbfdff}
.placeholder{color:#94a3b8;padding:7px}
.word-chip{background:#e9f2ff;border:1px solid #c8dcff;border-radius:10px;padding:8px 10px;font-weight:750}
.panel-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.primary{background:#1f5bd8;color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:800}
.primary:hover{background:#194bb5}
.board-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 2px 12px;flex-wrap:wrap}
.board-heading h2{margin:0;font-size:1.15rem}
.board-heading p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.board-image-wrap{position:relative;width:100%;max-width:1320px;margin:0 auto;line-height:0;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;border-radius:8px}
.board-image{display:block;width:100%;height:auto;pointer-events:none}
/* Invisible hit areas are aligned to the original picture cells in the supplied PDF. */
.grid{position:absolute;left:4.77%;top:10.98%;width:90.38%;height:77.25%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:0}
.tile{min-width:0;min-height:0;border:0;border-radius:0;background:transparent;box-shadow:none;padding:0;display:block;position:relative;color:transparent;overflow:hidden;cursor:pointer;touch-action:manipulation;transition:background .12s,outline-color .12s}
.tile:active{transform:none;box-shadow:none;background:#ffffff20}
.tile:focus-visible{outline:4px solid #285fe8;outline-offset:-5px;background:#ffffff18;z-index:2}
.tile .label,.tile .emoji,.tile .speak-indicator{display:none}
.blank{background:transparent;border:0;box-shadow:none;cursor:default;pointer-events:none}
.touch-mode .tile:not(.blank){background:#ffffff12}
.touch-mode .tile:focus-visible{outline-width:5px}
@media(max-width:720px){.grid{gap:0}.tile{min-height:0;padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">🦁</div>
    <div><h1>Lucas the Lion</h1><div class="subtitle">My communication board</div></div>
  </div>
  <div class="header-actions">
    <button class="utility" id="touchBtn" aria-pressed="false">👆 Touch mode: Off</button>
    <button class="utility" id="slowBtn" aria-pressed="false">🐢 Slow voice: Off</button>
    <button class="utility" id="stopBtn">■ Stop voice</button>
  </div>
</header>

<script>
const tiles = [
 {label:"I",say:"I",row:1,col:1}, {blank:true,row:1,col:2}, {blank:true,row:1,col:3}, {blank:true,row:1,col:4},
 {label:"Lucas the Lion",say:"Lucas the Lion",row:2,col:1}, {label:"see",say:"see",row:2,col:2}, {blank:true,row:2,col:3}, {label:"television",say:"television",row:2,col:4},
 {label:"mom",say:"mom",row:3,col:1}, {label:"play",say:"play",row:3,col:2}, {label:"help",say:"help",row:3,col:3}, {label:"bathroom",say:"bathroom",row:3,col:4},
 {label:"Blair the bear",say:"Blair the bear",row:4,col:1}, {label:"hungry",say:"hungry",row:4,col:2}, {blank:true,row:4,col:3}, {label:"tiny talker",say:"tiny talker",row:4,col:4},
 {blank:true,row:5,col:1}, {label:"thirsty",say:"thirsty",row:5,col:2}, {label:"hurt",say:"hurt",row:5,col:3}, {label:"sorry",say:"sorry",row:5,col:4},
 {label:"all done",say:"all done",row:6,col:1}, {label:"more please",say:"more please",row:6,col:2}, {label:"yes",say:"yes",row:6,col:3}, {label:"no",say:"no",row:6,col:4}
];
const board = document.getElementById("board");
const sentence = document.getElementById("sentence");
const status = document.getElementById("status");
let words = [];
let slow = false;
let touchMode = false;
let touchSpeak = true;
let voice = null;

function renderBoard(){
  tiles.forEach((item)=>{
    const b=document.createElement(item.blank?'div':'button');
    b.style.gridRow=String(item.row);
    b.style.gridColumn=String(item.col);
    if(item.blank){b.className="tile blank";b.setAttribute("aria-hidden","true");board.appendChild(b);return;}
    b.className="tile";
    b.type="button";
    b.setAttribute("aria-label",`Select ${item.say}`);
    b.title=item.say;
    b.innerHTML=`<span class="label"></span>`;
    b.querySelector(".label").textContent=item.label;
    b.addEventListener("click",()=>{words.push(item.say);renderSentence();if(!touchMode || touchSpeak) speak(item.say);});
    board.appendChild(b);
  });
}
function renderSentence(){
  sentence.replaceChildren();
  if(!words.length){
    const p=document.createElement("span");p.className="placeholder";p.textContent="Your words will appear here…";sentence.appendChild(p);
  } else {
    words.forEach((word)=>{
      const chip=document.createElement("span");chip.className="word-chip";chip.textContent=word;sentence.appendChild(chip);
    });
  }
}
function speak(text){
  if(!("speechSynthesis" in window)){status.textContent="Speech is not supported in this browser. Try a recent version of Chrome, Edge, or Safari.";return;}
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.rate=slow?0.72:0.92;
  utterance.pitch=1;
  if(voice) utterance.voice=voice;
  utterance.onstart=()=>{status.textContent="Speaking…";};
  utterance.onend=()=>{status.textContent="";};
  utterance.onerror=()=>{status.textContent="Unable to play speech. Please try again.";};
  window.speechSynthesis.speak(utterance);
}
document.getElementById("speakBtn").addEventListener("click",()=>{
  if(words.length) speak(words.join(" "));
  else status.textContent="Choose a picture to start your message.";
});
document.getElementById("undoBtn").addEventListener("click",()=>{words.pop();renderSentence();status.textContent="";});
document.getElementById("clearBtn").addEventListener("click",()=>{words=[];renderSentence();status.textContent="";});
document.getElementById("stopBtn").addEventListener("click",()=>{if("speechSynthesis" in window)window.speechSynthesis.cancel();status.textContent="Speech stopped.";});
document.getElementById("touchBtn").addEventListener("click",e=>{
  touchMode=!touchMode;
  document.body.classList.toggle("touch-mode",touchMode);
  e.currentTarget.setAttribute("aria-pressed",String(touchMode));
  e.currentTarget.textContent=touchMode?"👆 Touch mode: On":"👆 Touch mode: Off";
  document.getElementById("touchHint").textContent=touchMode?"Touch mode on — bigger buttons":"Touch mode is off";
  status.textContent=touchMode?"Larger touch targets enabled.":"Standard button size enabled.";
});
document.getElementById("slowBtn").addEventListener("click",e=>{
  slow=!slow;e.currentTarget.setAttribute("aria-pressed",String(slow));e.currentTarget.textContent=slow?"🐢 Slow voice: On":"🐢 Slow voice: Off";
});
renderBoard();
</script>
